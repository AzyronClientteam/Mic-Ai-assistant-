name: MIC AI Android

on:
  push:
    paths:
      - "MicAI/**"
      - ".github/workflows/mic-ai-android.yml"
  pull_request:
    paths:
      - "MicAI/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mic-ai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The GitHub ubuntu-latest runner image ships the Android SDK
      # (platform-tools, build-tools 34, platforms;android-34, cmdline-tools)
      # with ANDROID_HOME already exported, so no separate setup action is
      # needed. This step only tops up the packages if they are missing.
      - name: Ensure Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "ANDROID_HOME=$SDK"
          ls "$SDK/platforms" || true
          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: MicAI
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug 2>&1 | tee build.log

      - name: Surface compiler errors
        if: steps.build.outcome == 'failure'
        run: |
          grep -E '^e: ' MicAI/build.log | head -25 | while read -r line; do
            echo "::error::${line#e: }"
          done
          grep -E '^e: |FAILURE:|What went wrong|^Execution failed' MicAI/build.log | head -60

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mic-ai-build-log
          path: MicAI/build.log
          if-no-files-found: ignore

      - name: Fail the job if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Rename APK
        run: |
          mkdir -p out
          cp MicAI/app/build/outputs/apk/debug/app-debug.apk out/MIC-AI-debug.apk
          ls -la out/

      # Print what is actually inside the APK so the build proves the package
      # name, minSdk, permissions and launcher activity are what we claim.
      - name: Inspect APK
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | head -1)
          echo "using $AAPT2"
          "$AAPT2" dump badging out/MIC-AI-debug.apk \
            | grep -E "^package|^sdkVersion|^targetSdkVersion|^application-label:|^launchable-activity|^uses-permission" \
            | tee out/apk-badging.txt
          du -h out/MIC-AI-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mic-ai-debug-apk
          path: out/MIC-AI-debug.apk
          if-no-files-found: error

      # A GitHub Release gives a permanent, no-login download link that works
      # straight from a phone browser (Actions artifacts expire and require
      # being signed in). Re-uploaded with --clobber on every successful build.
      - name: Publish APK to release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="mic-ai-latest"
          SHA="${GITHUB_SHA:0:7}"
          {
            echo "Installable debug APK built from $SHA."
            echo
            echo "**Install:** download MIC-AI-debug.apk on your phone, allow installs"
            echo "from unknown sources when prompted, then open the file."
            echo
            echo "Requires Android 9 (API 28) or newer. The online AI brain needs an"
            echo "API key in Settings; every offline feature works without one."
            echo
            echo "### Verified APK contents (aapt2 badging)"
            echo
            echo '```'
            cat out/apk-badging.txt
            echo '```'
          } > out/notes.md
          gh release create "$TAG" \
            --target "$GITHUB_REF_NAME" \
            --title "MIC AI (debug build)" \
            --notes-file out/notes.md \
            out/MIC-AI-debug.apk || true
          gh release upload "$TAG" out/MIC-AI-debug.apk --clobber
          gh release edit "$TAG" --notes-file out/notes.md
