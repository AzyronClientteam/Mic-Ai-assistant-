name: MIC AI Android

on:
  push:
    paths:
      - "MicAI/**"
      - ".github/workflows/mic-ai-android.yml"
  pull_request:
    paths:
      - "MicAI/**"
  workflow_dispatch:

# The Android SDK, AGP and Kotlin compiler output are only readable through
# api.github.com in restricted build sandboxes, so a failed build republishes
# its compiler errors as annotations + .ci-build-errors.log (repo root, so the
# push filter above cannot retrigger this workflow).

permissions:
  contents: write

concurrency:
  group: mic-ai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The GitHub ubuntu-latest runner image ships the Android SDK
      # (platform-tools, build-tools 34, platforms;android-34, cmdline-tools)
      # with ANDROID_HOME already exported, so no separate setup action is
      # needed. This step only tops up the packages if they are missing.
      - name: Ensure Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "ANDROID_HOME=$SDK"
          ls "$SDK/platforms" || true
          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: MicAI
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug 2>&1 | tee build.log

      - name: Report errors
        if: steps.build.outcome == 'failure'
        run: |
          {
            echo "# MIC AI build errors"
            echo
            echo '```'
            grep -E '^e: |^> Task .*FAILED|FAILURE:|What went wrong|^Execution failed|Caused by:|error: ' \
              MicAI/build.log | head -120
            echo '```'
          } > .ci-build-errors.log
          grep -E '^e: ' MicAI/build.log | head -25 | while read -r line; do
            echo "::error::${line#e: }"
          done
          cat .ci-build-errors.log

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mic-ai-build-log
          path: MicAI/build.log
          if-no-files-found: ignore

      - name: Commit error report
        if: steps.build.outcome == 'failure' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .ci-build-errors.log
          git commit -m "chore: publish MIC AI compiler errors [skip ci]" || true
          git push origin "HEAD:${{ github.ref }}" || true

      - name: Fail the job if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Show APK
        run: ls -la MicAI/app/build/outputs/apk/debug/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mic-ai-debug-apk
          path: MicAI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
