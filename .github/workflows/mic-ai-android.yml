name: MIC AI Android

on:
  push:
    paths:
      - "MicAI/**"
      - ".github/workflows/mic-ai-android.yml"
  pull_request:
    paths:
      - "MicAI/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The GitHub ubuntu-latest runner image ships the Android SDK
      # (platform-tools, build-tools 34, platforms;android-34, cmdline-tools)
      # with ANDROID_HOME already exported, so no separate setup action is
      # needed. This step only tops up the packages if they are missing.
      - name: Ensure Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "ANDROID_HOME=$SDK"
          ls "$SDK/platforms" || true
          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: Build debug APK
        working-directory: MicAI
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Show APK
        run: ls -la MicAI/app/build/outputs/apk/debug/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mic-ai-debug-apk
          path: MicAI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
